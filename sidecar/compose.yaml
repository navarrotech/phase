services:
  llm-opponent:
    container_name: phase-llm-opponent
    build: .
    restart: unless-stopped
    # Loopback-only: this process holds a subscription credential and has no
    # authentication of its own. Publishing it on 0.0.0.0 hands anyone on the
    # network a free Claude endpoint billed to you.
    ports:
      - "127.0.0.1:${LLM_OPPONENT_PORT:-8788}:8788"
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      LLM_OPPONENT_MODEL: ${LLM_OPPONENT_MODEL:-claude-opus-5}
      LLM_OPPONENT_MAX_TURNS: ${LLM_OPPONENT_MAX_TURNS:-4}
      LLM_OPPONENT_ALLOW_WEB_SEARCH: ${LLM_OPPONENT_ALLOW_WEB_SEARCH:-false}
      LLM_OPPONENT_MAX_REQUEST_BYTES: ${LLM_OPPONENT_MAX_REQUEST_BYTES:-1048576}
    volumes:
      # Sources are mounted individually so the host's node_modules never shadows
      # the image's, and so `pnpm dev` inside the container can hot reload.
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Writable: the CLI rewrites credentials on OAuth refresh and appends
      # session transcripts. A :ro mount here works until the token ages out.
      - claude-config:/app/.claude
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  claude-config:
